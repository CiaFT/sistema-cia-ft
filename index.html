      width: min(430px, calc(100vw - 32px));
      pointer-events: none;
    }

    .toast-ft {
      --toast-cor: #374247;
      --toast-cor-suave: #eef2f6;
      position: relative;
      display: grid;
      grid-template-columns: 42px minmax(0, 1fr) 28px;
      gap: 11px;
      align-items: start;
      width: 100%;
      box-sizing: border-box;
      overflow: hidden;
      border: 1px solid color-mix(in srgb, var(--toast-cor) 32%, #ffffff);
      border-left: 5px solid var(--toast-cor);
      border-radius: 20px;
      background:
        radial-gradient(circle at top right, color-mix(in srgb, var(--toast-cor) 12%, transparent), transparent 55%),
        linear-gradient(180deg, #ffffff, #f8fafc);
      color: #17202a;
      box-shadow: 0 22px 60px rgba(15,23,42,.24), 0 4px 12px rgba(15,23,42,.08);
      padding: 14px 13px 15px 12px;
      opacity: 0;
      pointer-events: auto;
      transform: translateX(34px) scale(.97);
      transition: opacity .2s ease, transform .22s ease;
    }
    .toast-ft.visivel { opacity: 1; transform: translateX(0) scale(1); }
    .toast-ft.saindo { opacity: 0; transform: translateX(28px) scale(.98); }
    .toast-ft.sucesso { --toast-cor: #15803d; --toast-cor-suave: #dcfce7; }
    .toast-ft.erro { --toast-cor: #b91c1c; --toast-cor-suave: #fee2e2; }
    .toast-ft.atencao { --toast-cor: #D4AF37; --toast-cor-suave: #fef3c7; }
    .toast-ft.info { --toast-cor: #374247; --toast-cor-suave: #e9edf1; }
    .toast-ft.confirmacao { --toast-cor: #8E1B1B; --toast-cor-suave: #fce7eb; }

    .toast-ft-icone {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      border-radius: 13px;
      background: var(--toast-cor-suave);
      color: var(--toast-cor);
      font-size: 19px;
      font-weight: 950;
      box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--toast-cor) 14%, transparent);
    }
    .toast-ft-conteudo { min-width: 0; padding-top: 1px; }
    .toast-ft-titulo {
      display: block;
      margin: 0 0 4px;
      color: #17202a;
      font-size: 13.5px;
      font-weight: 950;
      line-height: 1.25;
      overflow-wrap: anywhere;
    }
    .toast-ft-texto {
      display: block;
      color: #59666d;
      font-size: 11.8px;
      font-weight: 650;
      line-height: 1.45;
      white-space: pre-line;
      overflow-wrap: anywhere;
    }
    .toast-ft-fechar {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 27px;
      height: 27px;
      margin: -3px -3px 0 0;
      border: 0;
      border-radius: 9px;
      background: transparent;
      color: #64748b;
      font: inherit;
      font-size: 17px;
      font-weight: 900;
      cursor: pointer;
    }
    .toast-ft-fechar:hover { background: #eef2f6; color: #17202a; }
    .toast-ft-fechar:focus-visible,
    .toast-ft-acao:focus-visible { outline: 3px solid color-mix(in srgb, var(--toast-cor) 24%, transparent); outline-offset: 2px; }
    .toast-ft-acoes {
      grid-column: 2 / -1;
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 2px;
    }
    .toast-ft-acao {
      min-width: 106px;
      border: 1.5px solid var(--toast-cor);
      border-radius: 12px;
      padding: 9px 13px;
      font: inherit;
      font-size: 10.5px;
      font-weight: 950;
      letter-spacing: .2px;
      cursor: pointer;
    }
    .toast-ft-acao.secundaria { background: #ffffff; color: #475569; border-color: #cbd5e1; }
    .toast-ft-acao.primaria { background: var(--toast-cor); color: #ffffff; }
    .toast-ft-progresso {
      position: absolute;
      left: 0;
      bottom: 0;
      width: 100%;
      height: 4px;
      background: var(--toast-cor);
      transform-origin: left;
      animation: toastFtTempo linear forwards;
    }
    .toast-ft.persistente .toast-ft-progresso { display: none; }
    @keyframes toastFtTempo { from { transform: scaleX(1); } to { transform: scaleX(0); } }

      justify-content: space-between;

    const API_URL = 'https://script.google.com/macros/s/AKfycbx93RwTCtmiZ45_Tke0CqH6ArL4kTbQFW54_pnXRq69IYfE8_5JSjvECzBLoGaiMroGZQ/exec';

    const APP = {
      usuario: null,
      menus: [],
      permissoes: {},
      credenciais: null,
      sessaoApi: null,
      sessaoExpiraEm: 0,
      renovacaoSessao: null,
      dadosControleFrequencia: null,
      dadosControleFolgas: null,
      dadosEscalasFolgas: null,
      urlPdfEscalaCiaFt: null,
      dadosRotinasAdministrativas: null,
      dadosVistoriaCop: null,
      apiBridgePronta: false,
      apiBridgePendentes: {},
      apiBridgeSequencia: 0,
      apiChamadasPendentes: {},
      apiCache: {},
      pdfRenderToken: 0

    document.addEventListener('DOMContentLoaded', function() {
      window.addEventListener('message', function(event) {
        tratarMensagemUploaderEscalaCiaFt(event);
        tratarMensagemPonteApiFt(event);
      });
      iniciarPonteApiFt();
      if (window.pdfjsLib) window.pdfjsLib.GlobalWorkerOptions.workerSrc = './pdf.worker.min.js?v=1210';
      document.getElementById('loginRE').addEventListener('keydown', function(ev) {
        if (ev.key === 'Enter') fazerLogin();
      });

      document.getElementById('loginSenha').addEventListener('keydown', function(ev) {
        if (ev.key === 'Enter') fazerLogin();
      });
    });


    function fazerLogin() {
      const login = document.getElementById('loginRE').value.trim();
      const senha = document.getElementById('loginSenha').value.trim();

      if (!login || !senha) {
        mostrarAlerta('Informe o RE e a senha.', 'erro');
        return;
      }

      setBotaoLogin(true);
      mostrarAlerta('Validando acesso...', 'info');

      chamarApi('login', { login, senha })
        .then(function(resp) {
          setBotaoLogin(false);

          if (!resp || !resp.ok) {
            mostrarAlerta(resp && resp.erro ? resp.erro : 'Falha no login.', 'erro');
            return;
          }

          APP.usuario = resp.dados.usuario;
          APP.menus = resp.dados.menus || [];
          APP.permissoes = resp.dados.permissoes || {};
          APP.credenciais = { login: login, senha: senha };
          APP.sessaoApi = resp.dados.sessaoToken || null;
          APP.sessaoExpiraEm = Number(resp.dados.sessaoExpiraEm || 0);

          document.getElementById('loginScreen').classList.add('hidden');
          document.getElementById('appScreen').classList.remove('hidden');
          window.scrollTo(0, 0);

          abrirHome();
        })
        .catch(function(err) {
          setBotaoLogin(false);
          mostrarAlerta('Erro ao conectar com a API.\n' + err.message, 'erro');
        });
    }


    function abrirHome() {
      window.scrollTo(0, 0);
      const u = APP.usuario;

      if (!u) return;

      const topoUsuarioLogado = document.getElementById('topUsuarioLogado');
      if (topoUsuarioLogado) {
        topoUsuarioLogado.textContent = [u.postoGrad, u.nomeGuerra].filter(Boolean).join(' ');
      }
      window.scrollTo(0, 0);

      document.getElementById('appConteudo').innerHTML = `
        <div class="home-hero">
          ${montarCardPolicial(u)}

          <div class="home-panel">
            <div class="section-title home-menu-title">
              <div>
                <h2>Menu Principal</h2>
                <p>Selecione uma área para acessar.</p>
              </div>
            </div>

            <div class="menu-grid">
              ${montarMenusHome().map(montarMenuCard).join('') || '<div class="modal-card">Nenhum menu liberado para seu perfil.</div>'}
            </div>
          </div>
        </div>
      `;
    }

    function montarCardPolicial(u) {
      const foto = u.foto
        ? '<img src="' + escapar(resolverFotoApp(u.foto, 'w1000')) + '" onerror="this.parentElement.innerHTML=\'👤\'">'
        : '👤';

      const classeHierarquia = classeVisualHierarquia(u.postoGrad);

      return `
        <div class="pm-profile-card ${classeHierarquia}">
          <div class="pm-photo-area">
            <div class="foto-pm home">${foto}</div>
          </div>

          <div class="pm-main-info">
            <h1>${escapar(u.postoGrad || '')} ${escapar(u.nomeGuerra || '')}</h1>
            <div class="re-line">RE ${escapar(u.re || '')}</div>
            <span class="status">${escapar(u.status || '')}</span>
          </div>

          <div class="pm-detail-list">
            ${pmDetail('Pelotão', u.pelotao)}
            ${pmDetail('Modalidade', u.modalidade)}
            ${pmDetail('Função', u.funcao)}
          </div>
        </div>
      `;
    }

    function homeSituation(icone, titulo, texto) {
      return `
        <div class="home-situation-card">
          <div class="sit-icon">${icone}</div>
          <h3>${escapar(titulo)}</h3>
          <p>${escapar(texto)}</p>
        </div>
      `;
    }


    function classeVisualHierarquia(postoGrad) {
      const p = normalizarTexto(postoGrad || '').replace(/[º°ª]/g, '');

      /*
       * IMPORTANTE:
       * SUBTEN precisa ser testado ANTES de TEN,
       * porque a palavra SUBTEN contém TEN.
       */
      if (
        p.includes('SUBTEN') ||
        p.includes('SUB TEN') ||
        p.includes('SGT')
      ) {
        return 'sgt';
      }

      if (
        p.includes('MAJ') ||
        p.includes('CAP') ||
        p.includes('ASP') ||
        (p.includes('TEN') && !p.includes('SUBTEN') && !p.includes('SUB TEN'))
      ) {
        return 'oficial';
      }

      if (
        p.includes('CB') ||
        p.includes('SD')
      ) {
        return 'praca';
      }

      return 'praca';
    }


    function quickStatus(rotulo, valor) {
      return `
        <div class="quick-status">
          <small>${escapar(rotulo)}</small>
          <strong>${escapar(valor || '-')}</strong>
        </div>
      `;
    }


    function pmDetail(rotulo, valor) {

          <small>${escapar(rotulo)}</small>
          <strong>${escapar(valor || '-')}</strong>
        </div>

    function infoCell(rotulo, valor) {
      return `
        <div class="info-cell">
          <small>${escapar(rotulo)}</small>
          <strong>${escapar(valor || '-')}</strong>
        </div>
      `;
    }



    function abrirMeusDados() {
      window.scrollTo(0, 0);

      const u = APP.usuario;
      if (!u) return abrirHome();

      const foto = u.foto
        ? '<img src="' + escapar(resolverFotoApp(u.foto, 'w1000')) + '" onerror="this.parentElement.innerHTML=\'👤\'">'
        : '👤';

      const classeHierarquia = classeVisualHierarquia(u.postoGrad);
      const ferias = montarTextoFerias(u);
      const eap = valorCampo(u, ['eap', 'EAP', 'eapPeriodo', 'periodoEap']);

      document.getElementById('appConteudo').innerHTML = `
        <div class="page-wrap">
          <div class="page-header">
            <div class="page-header-row">
              <div>
                <div class="page-kicker">Área pessoal</div>
                <h1>Meus Dados</h1>
                <p>Consulta dos dados cadastrados no Sistema CIA FT. Alterações devem ser solicitadas para análise administrativa.</p>
              </div>
              <div class="page-actions">
                <button class="btn-page" onclick="abrirHome()">VOLTAR</button>
              </div>
            </div>
          </div>

          <div class="meus-dados-grid">
            <div class="dados-card ${classeHierarquia}">
              <div class="perfil-resumo">
                <div class="foto-pm home">${foto}</div>
                <h2>${escapar(u.postoGrad || '')} ${escapar(u.nomeGuerra || '')}</h2>
                <div class="sub">RE ${escapar(u.re || '')}</div>
              </div>

              <div class="dados-card-body">
                <div class="dados-lista">
                  ${dadosItem('Perfil de acesso', u.perfilAcesso)}
                </div>
              </div>
            </div>

            <div class="dados-accordion-wrap">
              <div class="dados-accordion-card fechado" id="secInfoPessoais">
                ${dadosAccordionTitulo('INFORMAÇÕES PESSOAIS', 'secInfoPessoais')}
                <div class="dados-accordion-body">
                  <div class="dados-card informacoes-basicas" style="box-shadow:none;border-radius:18px;margin-bottom:14px;">
                    <div class="dados-card-header">
                      <h2>Informações Básicas</h2>
                      <p>Dados pessoais, funcionais e administrativos do policial.</p>
                    </div>
                    <div class="dados-card-body">
                      <div class="info-basica-grid">
                        ${dadosItem('Nome Completo', valorCampo(u, ['nomeCompleto', 'nome', 'nomePm']))}
                        ${dadosItem('Nome de Guerra', u.nomeGuerra)}
                        ${dadosItem('Graduação', u.postoGrad)}
                        ${dadosItem('RE', u.re)}
                        ${dadosItem('CPF', valorCampo(u, ['cpf', 'CPF']))}
                        ${dadosItem('RG', valorCampo(u, ['rg', 'RG']))}
                        ${dadosItem('Data de nascimento', valorCampo(u, ['dataNascimento', 'nascimento', 'dtNascimento']))}
                        ${dadosItem('Data de entrada na Cia FT', valorCampo(u, ['dataEntrada', 'entradaCiaFt', 'entrada', 'dataEntradaCia']))}
                        ${dadosItem('Férias', ferias)}
                        ${dadosItem('EAP', eap)}
                      </div>
                    </div>
                  </div>

                  <div class="dados-card contato-card" style="box-shadow:none;border-radius:18px;margin-bottom:14px;">
                    <div class="dados-card-header">
                      <h2>Contato</h2>
                      <p>Dados usados para comunicação e localização.</p>
                    </div>
                    <div class="dados-card-body">
                      <div class="contato-grid">
                        ${dadosItem('Telefone', u.telefone)}
                        ${dadosItem('E-mail', u.email)}
                        ${dadosItem('Endereço', u.endereco, 'endereco')}
                      </div>
                    </div>
                  </div>

                  <div class="solicitacao-box">
                    <h3>Solicitação de alteração</h3>
                    <p>O policial pode solicitar correção cadastral. A alteração somente será aplicada após aprovação administrativa.</p>
                    <button class="btn-primary-soft" onclick="abrirSolicitacaoDados()">SOLICITAR ALTERAÇÃO DE DADOS</button>
                  </div>
                </div>
              </div>

              <div class="dados-accordion-card fechado" id="secMaterialBelico">
                ${dadosAccordionTitulo('MATERIAL BÉLICO', 'secMaterialBelico')}
                <div class="dados-accordion-body">
                  ${montarMaterialBelico(u)}
                </div>
              </div>

              <div class="dados-accordion-card fechado" id="secRomaneio">
                ${dadosAccordionTitulo('ROMANEIO', 'secRomaneio')}
                <div class="dados-accordion-body">
                  <div class="solicitacao-box">
                    <h3>Romaneio</h3>
                    <p>Área preparada para implantação futura.</p>
                  </div>
                </div>
              </div>

              <div class="dados-accordion-card fechado" id="secSenhaApp">
                ${dadosAccordionTitulo('ALTERAÇÃO DE SENHA DO APP', 'secSenhaApp')}
                <div class="dados-accordion-body">
                  <div class="senha-app-box">
                    <input id="novaSenhaApp" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="4" placeholder="0000" oninput="this.value=this.value.replace(/\\D/g,'').slice(0,4)">
                    <button id="btnMudarSenhaApp" class="btn-primary-soft" onclick="mudarSenhaApp()">MUDAR SENHA APP</button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      `;

    function dadosItem(rotulo, valor, classeExtra) {
      return `
        <div class="dados-item ${escaparAttr(classeExtra || '')}">
          <small>${escapar(rotulo)}</small>
          <strong>${escapar(valor || '-')}</strong>
        </div>
      `;
    }


    function dadosAccordionTitulo(titulo, id) {
      return `
        <button class="dados-accordion-toggle" type="button" onclick="alternarDadosAccordion('${escaparAttr(id)}')">
          <h2>${escapar(titulo)}</h2>
          <small aria-hidden="true"></small>
        </button>
      `;
    }

    function alternarDadosAccordion(id) {
      const el = document.getElementById(id);
      if (el) el.classList.toggle('fechado');
    }

    function montarMaterialBelico(u) {
      const material = u && u.materialBelico ? u.materialBelico : {};
      const arma = Array.isArray(material.arma) ? material.arma : [];
      const colete = Array.isArray(material.colete) ? material.colete : [];
      const algema = Array.isArray(material.algema) ? material.algema : [];

      return `
        <div class="dados-section-grid basicas">
          ${montarGrupoMaterialBelico('ARMA', arma)}
          ${montarGrupoMaterialBelico('COLETE', colete)}
          ${montarGrupoMaterialBelico('ALGEMA', algema)}
        </div>
      `;
    }

    function montarGrupoMaterialBelico(titulo, lista) {
      return `
        <div class="dados-card full" style="box-shadow:none;border-radius:18px;">
          <div class="dados-card-header">
            <h2>${escapar(titulo)}</h2>
          </div>
          <div class="dados-card-body">
            <div class="info-basica-grid">
              ${lista.length ? lista.map(function(item) {
                return dadosItem(item.rotulo, item.valor);
              }).join('') : dadosItem('Registro', '-')}
            </div>
          </div>
        </div>
      `;
    }

    function mudarSenhaApp() {
      const input = document.getElementById('novaSenhaApp');
      const btn = document.getElementById('btnMudarSenhaApp');
      const novaSenha = input ? String(input.value || '').trim() : '';

      if (!/^\d{4}$/.test(novaSenha)) {
        mostrarToastFt('Senha não alterada', 'Digite exatamente quatro números.');
        return;
      }

      if (!APP.credenciais || !APP.credenciais.login || !APP.credenciais.senha) {
        mostrarToastFt('Sessão inválida', 'Faça login novamente.');
        return;
      }

      if (btn) {
        btn.disabled = true;
        btn.textContent = 'ALTERANDO...';
      }

      chamarApi('alterar_senha_app', {
          login: APP.credenciais.login,
          senha: APP.credenciais.senha,
          novaSenha: novaSenha
        })
        .then(function(resp) {
          if (!resp || !resp.ok) {
            throw new Error(resp && resp.erro ? resp.erro : 'Falha ao alterar a senha.');
          }

          APP.credenciais.senha = novaSenha;
          APP.sessaoApi = resp.dados.sessaoToken || APP.sessaoApi;
          APP.sessaoExpiraEm = Number(resp.dados.sessaoExpiraEm || APP.sessaoExpiraEm || 0);
          if (input) input.value = '';
          mostrarToastFt('Senha alterada', 'Senha do app alterada com sucesso.');
        })
        .catch(function(err) {
          mostrarToastFt('Senha não alterada', err.message || String(err));
        })
        .finally(function() {
          if (btn) {
            btn.disabled = false;
            btn.textContent = 'MUDAR SENHA APP';
          }
        });
    }


    function chipCampo(texto) {
      return `<span class="campo-chip">${escapar(texto)}</span>`;
    }


    function valorCampo(obj, nomes) {
      for (const nome of nomes) {
        if (obj && obj[nome] !== undefined && obj[nome] !== null && String(obj[nome]).trim() !== '') {
          return obj[nome];
        }
      }
      return '';
    }


    function montarTextoFerias(u) {
      const ferias30 = valorCampo(u, ['ferias30', 'ferias', 'feriasAj', 'feriasAJ']);
      const ferias15a = valorCampo(u, ['ferias15a', 'ferias1', 'feriasAk', 'feriasAK']);
      const ferias15b = valorCampo(u, ['ferias15b', 'ferias2', 'feriasAl', 'feriasAL']);

      if (ferias30) return ferias30;
      if (ferias15a || ferias15b) {
        return [ferias15a, ferias15b].filter(Boolean).join(' • ');
      }
      return '';
    }


    function abrirSolicitacaoDados() {
      window.scrollTo(0, 0);

      document.getElementById('appConteudo').innerHTML = `
        <div class="page-wrap">
          <div class="page-header">

    function gerarPdfVistoriaCop(botao, imprimir) {
      const d = APP.dadosVistoriaCop;
      if (!d) return;
      const janela = imprimir ? window.open('', '_blank') : null;
      if (imprimir && janela) janela.document.write('<title>Vistoria de COP</title><p style="font-family:Arial;padding:20px">Preparando relatório para impressão...</p>');
      if (botao) { botao.disabled = true; botao.textContent = imprimir ? 'PREPARANDO...' : 'GERANDO...'; }
      chamarApi('gerar_pdf_vistoria_cop', { competencia: d.competencia }, { semCache: true }).then(function(resp) {
        if (!resp || !resp.ok) throw new Error(resp && resp.erro ? resp.erro : 'Não foi possível gerar o PDF.');
        if (!imprimir) {
          baixarArquivoBase64Frequencia(resp.dados.base64, resp.dados.mimeType || 'application/pdf', resp.dados.nomeArquivo || 'Vistoria_COP.pdf');
          mostrarToastFt('PDF gerado', 'Relatório mensal baixado com sucesso.', 'sucesso');
          return;
        }
        const url = criarUrlArquivoBase64Cop(resp.dados.base64, resp.dados.mimeType || 'application/pdf');
        if (janela) {
          janela.location.replace(url);
          setTimeout(function() { try { janela.focus(); janela.print(); } catch (ignorado) {} }, 1200);
          setTimeout(function() { URL.revokeObjectURL(url); }, 120000);
        } else {
          URL.revokeObjectURL(url);
          mostrarToastFt('Impressão bloqueada', 'Autorize novas janelas no navegador e tente novamente.', 'atencao');
        }
      }).catch(function(erro) {
        if (janela) janela.close();
        mostrarToastFt('PDF não gerado', erro.message || String(erro), 'erro');
      }).finally(function() {
        if (botao && document.body.contains(botao)) { botao.disabled = false; botao.textContent = imprimir ? 'IMPRIMIR' : 'BAIXAR PDF'; }
      });
    }


    function criarUrlArquivoBase64Cop(base64, mimeType) {
      const binario = window.atob(String(base64 || '').replace(/\s/g, ''));
      const bytes = new Uint8Array(binario.length);
      for (let indice = 0; indice < binario.length; indice++) bytes[indice] = binario.charCodeAt(indice);
      return URL.createObjectURL(new Blob([bytes], { type: mimeType || 'application/pdf' }));
    }

        if (box) box.innerHTML = '<div class="adm-alerta">' + escapar(err.message || String(err)) + '</div>';
      });
    }


    function renderizarRotinasAdministrativas() {
      const box = document.getElementById('rotinasAdministrativasConteudo');
      const dados = APP.dadosRotinasAdministrativas || {};
      if (!box) return;

      const totaisMensais = contarRotinasMensaisCliente(dados.mensais || []);
      const totaisSemanais = contarRotinasSemanaisCliente(dados.semanas || []);
      box.innerHTML = `
        <div class="rotinas-resumo">
          <div class="rotinas-resumo-card"><small>Mês de referência</small><strong>${escapar(dados.mesReferencia || dados.competencia || '-')}</strong></div>
          <div class="rotinas-resumo-card"><small>Rotinas mensais</small><strong>${totaisMensais.concluidas} de ${totaisMensais.total} concluídas</strong></div>
          <div class="rotinas-resumo-card"><small>Rotinas semanais e diárias</small><strong>${totaisSemanais.concluidas} de ${totaisSemanais.total} concluídas</strong></div>
        </div>
        <div class="rotinas-regra">
          ${escapar(dados.regraDiasUteis || '')} Cada confirmação é vinculada ao policial logado e não pode ser desfeita pelo usuário.
        </div>

        <section class="rotinas-secao">
          <div class="rotinas-secao-cabecalho">
            <div><h2>Rotinas Mensais</h2><p>Prazos calculados para ${escapar(dados.mesReferencia || 'o mês atual')}.</p></div>
            <span class="rotinas-contador">${totaisMensais.concluidas}/${totaisMensais.total} CONCLUÍDAS</span>
          </div>
          <div class="rotinas-mensais-grid">
            ${(dados.mensais || []).map(montarSetorRotinasMensais).join('')}
          </div>
        </section>

        <section class="rotinas-secao">
          <div class="rotinas-secao-cabecalho">
            <div><h2>Rotinas Semanais</h2><p>Tarefas específicas e missões diárias de segunda a sexta-feira.</p></div>
            <span class="rotinas-contador">${totaisSemanais.concluidas}/${totaisSemanais.total} CONCLUÍDAS</span>
          </div>
          <div class="rotinas-semanas">
            ${(dados.semanas || []).map(montarSemanaRotinasAdministrativas).join('')}
          </div>
        </section>`;
    }


    function contarRotinasMensaisCliente(setores) {
      let total = 0;
      let concluidas = 0;
      (setores || []).forEach(function(setor) {
        (setor.tarefas || []).forEach(function(tarefa) {
          total++;
          if (tarefa.conclusao) concluidas++;
        });
      });
      return { total: total, concluidas: concluidas };
    }


    function contarRotinasSemanaisCliente(semanas) {
      let total = 0;
      let concluidas = 0;
      (semanas || []).forEach(function(semana) {
        (semana.dias || []).forEach(function(dia) {
          (dia.tarefas || []).forEach(function(tarefa) {
            total++;
            if (tarefa.conclusao) concluidas++;
          });
        });
      });
      return { total: total, concluidas: concluidas };
    }


    function montarSetorRotinasMensais(setor) {
      const tarefas = setor.tarefas || [];
      const concluidas = tarefas.filter(function(item) { return !!item.conclusao; }).length;
      return `
        <div class="rotina-setor-card">
          <div class="rotina-setor-titulo"><h3>${escapar(setor.setor || '-')}</h3><span>${concluidas}/${tarefas.length}</span></div>
          <div class="rotina-setor-lista">${tarefas.map(montarItemRotinaMensal).join('')}</div>
        </div>`;
    }


    function montarItemRotinaMensal(tarefa) {
      const concluida = !!tarefa.conclusao;
      const classePrazo = classeAlertaPrazoRotinaCliente(tarefa, (APP.dadosRotinasAdministrativas || {}).hojeISO);
      return `
        <div class="rotina-mensal-item ${concluida ? 'concluida' : ''}">
          ${botaoCheckRotinaCliente('MENSAL', (APP.dadosRotinasAdministrativas || {}).competencia, tarefa)}
          <div class="rotina-conteudo">
            <strong>${escapar(tarefa.nome || '-')}</strong>
            ${metadadosConclusaoRotinaCliente(tarefa.conclusao)}
          </div>
          <div class="rotina-prazo-wrap">
            <span class="rotina-prazo ${classePrazo}">PRAZO: ${escapar(tarefa.prazoBR || '-')}</span>
            <span class="rotina-prazo-regra">${escapar(tarefa.regraPrazo || '')}</span>
          </div>
        </div>`;
    }


    function classeAlertaPrazoRotinaCliente(tarefa, hojeISO) {
      if (!tarefa || tarefa.conclusao || !tarefa.prazoISO || !hojeISO) return '';
      if (hojeISO >= tarefa.prazoISO) return 'alerta-vinho';
      return diferencaDiasDatasRotinaCliente(hojeISO, tarefa.prazoISO) === 1 ? 'alerta-dourado' : '';
    }


    function diferencaDiasDatasRotinaCliente(inicioISO, fimISO) {
      const inicio = String(inicioISO || '').split('-').map(Number);
      const fim = String(fimISO || '').split('-').map(Number);
      if (inicio.length !== 3 || fim.length !== 3) return NaN;
      return Math.round((Date.UTC(fim[0], fim[1] - 1, fim[2]) - Date.UTC(inicio[0], inicio[1] - 1, inicio[2])) / 86400000);
    }


    function montarSemanaRotinasAdministrativas(semana) {
      const dias = semana.dias || [];
      const total = dias.reduce(function(soma, dia) { return soma + (dia.tarefas || []).length; }, 0);
      const concluidas = dias.reduce(function(soma, dia) {
        return soma + (dia.tarefas || []).filter(function(item) { return !!item.conclusao; }).length;
      }, 0);
      return `
        <div class="rotina-semana-card">
          <div class="rotina-semana-titulo"><h3>${escapar(semana.rotulo || ('SEMANA ' + semana.numero))}</h3><span>${concluidas}/${total} CONCLUÍDAS</span></div>
          <div class="rotina-semana-dias">${dias.map(montarDiaRotinasAdministrativas).join('')}</div>
        </div>`;
    }


    function montarDiaRotinasAdministrativas(dia) {
      const tarefas = dia.tarefas || [];
      const especificas = tarefas.filter(function(item) { return item.grupo !== 'DIÁRIA'; });
      const diarias = tarefas.filter(function(item) { return item.grupo === 'DIÁRIA'; });
      return `
        <div class="rotina-dia-card ${dia.hoje ? 'hoje' : ''}">
          <div class="rotina-dia-cabecalho"><strong>${escapar(dia.diaSemana || '-')}</strong><span>${escapar(dia.dataBR || '-')}</span></div>
          ${especificas.length ? '<div class="rotina-dia-grupo-titulo">Rotinas do dia</div><div class="rotina-dia-tarefas">' + especificas.map(function(item) { return montarItemRotinaDia(item, dia.dataISO); }).join('') + '</div>' : ''}
          <div class="rotina-dia-grupo-titulo">Missões diárias</div>
          <div class="rotina-dia-tarefas">${diarias.map(function(item) { return montarItemRotinaDia(item, dia.dataISO); }).join('')}</div>
        </div>`;
    }


    function montarItemRotinaDia(tarefa, dataISO) {
      const concluida = !!tarefa.conclusao;
      return `
        <div class="rotina-diaria-item ${concluida ? 'concluida' : ''}">
          ${botaoCheckRotinaCliente('SEMANAL', dataISO, tarefa)}
          <div class="rotina-conteudo">
            <strong>${escapar(tarefa.nome || '-')}</strong>
            ${tarefa.periodicidade === 'QUINZENAL' ? '<span class="rotina-periodicidade">Quinzenal · 1ª e 3ª ocorrência no mês</span>' : ''}
            ${metadadosConclusaoRotinaCliente(tarefa.conclusao)}
          </div>
        </div>`;
    }


    function botaoCheckRotinaCliente(tipo, referencia, tarefa) {
      const concluida = !!tarefa.conclusao;
      return `<button class="rotina-check ${concluida ? 'concluida' : ''}" type="button" aria-label="${concluida ? 'Tarefa concluída' : 'Confirmar tarefa ' + escaparAttr(tarefa.nome || '')}" ${concluida ? 'disabled' : ''} onclick="confirmarRotinaAdministrativa('${escaparAttr(tipo)}','${escaparAttr(referencia || '')}','${escaparAttr(tarefa.id || '')}','${escaparAttr(tarefa.nome || '')}',this)">${concluida ? '✓' : '✓'}</button>`;
    }


    function metadadosConclusaoRotinaCliente(conclusao) {
      if (!conclusao) return '<span class="rotina-meta">Pendente de confirmação.</span>';
      return '<span class="rotina-meta">Concluído por: ' + escapar(conclusao.policial || '-') + '<br>' + escapar(conclusao.dataHora || '-') + '</span>';
    }


    function confirmarRotinaAdministrativa(tipo, referencia, idTarefa, nomeTarefa, botao) {
      const textoReferencia = tipo === 'MENSAL' ? ((APP.dadosRotinasAdministrativas || {}).mesReferencia || referencia) : dataISOParaBR(referencia);
      confirmarToastFt(
        'CONFIRMAR CONCLUSÃO',
        'Tarefa: ' + nomeTarefa + '\nReferência: ' + textoReferencia + '\n\nO registro ficará vinculado ao seu login e não poderá ser desfeito.',
        { confirmar: 'CONFIRMAR TAREFA', cancelar: 'CANCELAR' }
      ).then(function(confirmado) {
        if (!confirmado) return;
        executarRegistroRotinaAdministrativa(tipo, referencia, idTarefa, botao);
      });
    }


    function executarRegistroRotinaAdministrativa(tipo, referencia, idTarefa, botao) {
      if (botao) {
        botao.disabled = true;
        botao.classList.add('salvando');
        botao.textContent = '…';
      }

      chamarApi('registrar_rotina_administrativa', {
        login: APP.credenciais.login,
        senha: APP.credenciais.senha,
        tipo: tipo,
        referencia: referencia,
        idTarefa: idTarefa
      }).then(function(resp) {
        if (!resp || !resp.ok) throw new Error(resp && resp.erro ? resp.erro : 'Falha ao registrar a rotina.');
        aplicarConclusaoRotinaAdministrativaCliente(tipo, referencia, idTarefa, resp.dados.conclusao);
        renderizarRotinasAdministrativas();
        mostrarToastFt(resp.dados.jaConcluida ? 'Tarefa já concluída' : 'Rotina registrada', resp.dados.mensagem || 'Conclusão registrada.');
      }).catch(function(err) {
        if (botao && document.body.contains(botao)) {
          botao.disabled = false;
          botao.classList.remove('salvando');
          botao.textContent = '✓';
        }
        mostrarToastFt('Rotina não registrada', err.message || String(err));
      });
    }


    function aplicarConclusaoRotinaAdministrativaCliente(tipo, referencia, idTarefa, conclusao) {
      const dados = APP.dadosRotinasAdministrativas || {};
      if (tipo === 'MENSAL') {
        (dados.mensais || []).forEach(function(setor) {
          (setor.tarefas || []).forEach(function(tarefa) {
            if (tarefa.id === idTarefa) tarefa.conclusao = conclusao;
          });
        });
        return;
      }
      (dados.semanas || []).forEach(function(semana) {
        (semana.dias || []).forEach(function(dia) {
          if (dia.dataISO !== referencia) return;
          (dia.tarefas || []).forEach(function(tarefa) {
            if (tarefa.id === idTarefa) tarefa.conclusao = conclusao;
          });
        });
      });
    }


    function abrirControleFrequencia(competencia) {
      window.scrollTo(0, 0);
      const alvo = competencia || (APP.dadosControleFrequencia && APP.dadosControleFrequencia.competencia) || '2026-08';
      document.getElementById('appConteudo').innerHTML = `
        <div class="page-wrap">
          <div class="page-header">
            <div class="page-header-row">
              <div>
                <div class="page-kicker">Painel Administrativo</div>
                <h1>Controle de Frequência</h1>
                <p>Lançamento manual, auditoria semanal e fechamento mensal.</p>
              </div>
              <div class="page-actions"><button class="btn-page" onclick="abrirPainelAdministrativo()">VOLTAR</button></div>
            </div>
          </div>
          <div id="freqConteudo"><div class="resenha-loading">Carregando controle de frequência...</div></div>
        </div>`;

      chamarApi('dados_controle_frequencia', {
        login: APP.credenciais.login,
        senha: APP.credenciais.senha,
        competencia: alvo
      }).then(function(resp) {
        if (!resp || !resp.ok) throw new Error(resp && resp.erro ? resp.erro : 'Falha ao carregar o Controle de Frequência.');
        APP.dadosControleFrequencia = resp.dados;
        renderizarControleFrequencia();
      }).catch(function(err) {
        const box = document.getElementById('freqConteudo');
        if (box) box.innerHTML = '<div class="adm-alerta">' + escapar(err.message || String(err)) + '</div>';
      });
    }


    function renderizarControleFrequencia() {
      const box = document.getElementById('freqConteudo');
      const d = APP.dadosControleFrequencia;
      if (!box || !d) return;
      const fechado = d.auditoria && d.auditoria.fechamentoCmt && d.auditoria.fechamentoCmt.status === 'APROVADO';
      box.innerHTML = `
        <div class="freq-months" aria-label="Meses do Controle de Frequência">
          ${(d.meses || []).map(function(mes) {
            return '<button type="button" class="freq-month-btn ' + (mes === d.competencia ? 'ativo' : '') + '" onclick="abrirControleFrequencia(\'' + escaparAttr(mes) + '\')">' + escapar(rotuloCompetenciaFrequencia(mes)) + '</button>';
          }).join('')}
        </div>

        <details class="freq-legend" open>
          <summary>LEGENDA DOS LANÇAMENTOS</summary>
          <div class="freq-legend-grid">
            ${itemLegendaFrequencia('0', 'Inferior a 8 horas')}
            ${itemLegendaFrequencia('1', 'Entre 8 horas e inferior a 12 horas')}
            ${itemLegendaFrequencia('2', '12 horas ou mais')}
            ${itemLegendaFrequencia('3', '18 horas e igual ou inferior a 24 horas')}
            ${itemLegendaFrequencia('F', 'Férias')}
            ${itemLegendaFrequencia('LP', 'Licença-prêmio')}
            ${itemLegendaFrequencia('CV', 'Convalescença médica')}
            ${itemLegendaFrequencia('TS', 'Licença para tratamento de saúde')}
            ${itemLegendaFrequencia('DS/DR', 'Dispensa de serviço/recompensa')}
            ${itemLegendaFrequencia('N', 'Núpcias')}
            ${itemLegendaFrequencia('A', 'Outro tipo de afastamento')}
          </div>
        </details>

        <div id="freqAuditArea">${montarAuditoriaFrequencia(d)}</div>
        <div class="freq-note">Os lançamentos são salvos individualmente. ${fechado ? '<strong>Este mês está encerrado pelo Cmt de Cia.</strong>' : 'Role a tabela horizontalmente para acessar todos os dias e os totais.'}</div>
        ${montarTabelaFrequencia(d, fechado)}
      `;
    }


    function itemLegendaFrequencia(codigo, texto) {
      return '<div><strong>' + escapar(codigo) + '</strong>' + escapar(texto) + '</div>';
    }


    function rotuloCompetenciaFrequencia(competencia) {
      const partes = String(competencia || '').split('-');
      const nomes = ['JANEIRO','FEVEREIRO','MARÇO','ABRIL','MAIO','JUNHO','JULHO','AGOSTO','SETEMBRO','OUTUBRO','NOVEMBRO','DEZEMBRO'];
      const mes = Number(partes[1] || 0);
      return (nomes[mes - 1] || competencia) + '/' + String(partes[0] || '').slice(-2);
    }


    function montarAuditoriaFrequencia(d) {
      const a = d.auditoria || {};
      const cap = d.capacidades || {};
      const semanas = a.semanas || [];
      const diasNoMes = Number(d.diasNoMes || 31);
      return `
        <div class="freq-audit-grid">
          ${Array.from({length:Math.ceil(diasNoMes / 7)}, function(_, indiceSemana) {
            const numero = indiceSemana + 1;
            const item = semanas[numero - 1] || { numero: numero, status: 'PENDENTE' };
            const inicio = ((numero - 1) * 7) + 1;
            const fim = Math.min(numero * 7, diasNoMes);
            const ok = item.status === 'AUDITADA';
            return '<div class="freq-audit-card"><small>SEMANA ' + numero + ' • ' + inicio + ' A ' + fim + '</small>' +
              '<strong class="' + (ok ? 'ok' : '') + '">' + escapar(item.status || 'PENDENTE') + '</strong>' +
              (item.nome ? '<small>' + escapar(item.nome) + ' • ' + escapar(item.dataHora || '') + '</small>' : '') +
              (cap.podeAuditarSemana && !ok ? '<button type="button" onclick="auditarControleFrequencia(\'SEMANAL\',' + numero + ')">MARCAR COMO AUDITADA</button>' : '') +
              '</div>';
          }).join('')}
        </div>
        <div class="freq-close-grid">
          ${montarFechamentoFrequencia('CONFERÊNCIA FINAL • ENC ADM', a.fechamentoEnc, cap.podeFecharEnc, 'FECHAMENTO_ENC')}
          ${montarFechamentoFrequencia('APROVAÇÃO FINAL • CMT CIA', a.fechamentoCmt, cap.podeFecharCmt, 'FECHAMENTO_CMT')}
        </div>
        ${montarGeracaoPdfFrequencia(d)}`;
    }


    function montarGeracaoPdfFrequencia(d) {
      const fechamento = d && d.auditoria && d.auditoria.fechamentoCmt || { status: 'PENDENTE' };
      const pronto = fechamento.status === 'APROVADO';
      return '<div class="freq-pdf-card ' + (pronto ? 'pronto' : '') + '">' +
        '<div class="freq-pdf-info"><span class="freq-pdf-icon" aria-hidden="true">▣</span><div>' +
          '<h3>RELATÓRIO MENSAL EM PDF</h3>' +
          '<p>' + (pronto ? 'Mês encerrado. Gere o relatório oficial de ' + escapar(rotuloCompetenciaFrequencia(d.competencia)) + ' com os lançamentos e totais consolidados.' : 'Disponível após a aprovação final e o encerramento do mês pelo Cmt de Cia.') + '</p>' +
        '</div></div>' +
        '<button id="freqPdfBtn" type="button" onclick="gerarPdfControleFrequencia()" ' + (pronto ? '' : 'disabled') + '>' + (pronto ? 'GERAR PLANILHA PDF' : 'AGUARDANDO FECHAMENTO') + '</button>' +
      '</div>';
    }


    function montarFechamentoFrequencia(titulo, item, pode, tipo) {
      item = item || { status: 'PENDENTE' };
      const concluido = item.status === 'CONFERIDO' || item.status === 'APROVADO';
      return '<div class="freq-close-card"><h3>' + escapar(titulo) + '</h3>' +
        '<p><strong>' + escapar(item.status || 'PENDENTE') + '</strong>' + (item.nome ? ' por ' + escapar(item.nome) + ' em ' + escapar(item.dataHora || '') : '') + '</p>' +
        (pode && !concluido ? '<button type="button" onclick="auditarControleFrequencia(\'' + tipo + '\',0)">' + (tipo === 'FECHAMENTO_ENC' ? 'CONCLUIR CONFERÊNCIA' : 'APROVAR E ENCERRAR MÊS') + '</button>' : '') +
        '</div>';
    }


    function montarTabelaFrequencia(d, fechado) {
      const diasNoMes = Number(d.diasNoMes || 31);
      const opcoes = d.opcoes || [];
      const efetivo = d.efetivo || [];
      const lancamentos = d.lancamentos || {};
      const podeEditar = !!(d.capacidades && d.capacidades.podeEditar) && (!fechado || !!d.capacidades.podeReabrir);
      let corpo = '';
      ['ADM','1º PEL','2º PEL'].forEach(function(grupo) {
        const lista = efetivo.filter(function(pm) { return pm.pelotao === grupo; });
        if (!lista.length) return;
        corpo += '<tr class="freq-group"><td colspan="' + (diasNoMes + 3) + '">' + escapar(grupo) + '</td></tr>';
        lista.forEach(function(pm) {
          const chave = normalizarReClienteFrequencia(pm.re);
          const reg = lancamentos[chave] || { dias: [], diarias: 0, diasTrabalhados: 0 };
          corpo += '<tr data-freq-re="' + escaparAttr(pm.re || '') + '">' +
            '<td class="freq-pm"><strong>' + escapar([pm.postoGrad, pm.nomeGuerra].filter(Boolean).join(' ')) + '</strong><small>RE ' + escapar(pm.re || '') + '</small></td>' +
            Array.from({length:diasNoMes}, function(_, indice) {
              const dia = indice + 1;
              const atual = String((reg.dias || [])[indice] || '');
              const classeVisual = classesCelulaFrequencia(grupo, atual);
              return '<td class="freq-day"><div class="freq-select-wrap ' + classeVisual + (podeEditar ? '' : ' freq-bloqueado') + '"><span class="freq-select-display" aria-hidden="true">' + escapar(atual) + '</span><select class="freq-native-select ' + classeVisual + '" aria-label="Dia ' + dia + ' de ' + escapar(pm.nomeGuerra || '') + '" data-grupo="' + escaparAttr(grupo) + '" data-re="' + escaparAttr(pm.re || '') + '" data-dia="' + dia + '" data-valor-anterior="' + escaparAttr(atual) + '" onchange="salvarCelulaFrequencia(this)" ' + (podeEditar ? '' : 'disabled') + '>' +
                '<option value=""></option>' + opcoes.map(function(op) { return '<option value="' + escaparAttr(op) + '" ' + (atual === String(op) ? 'selected' : '') + '>' + escapar(op) + '</option>'; }).join('') +
                '</select></div></td>';
            }).join('') +
            '<td class="freq-total diarias" data-total-diarias="' + escaparAttr(pm.re || '') + '">' + Number(reg.diarias || 0) + '</td>' +
            '<td class="freq-total trabalhados" data-total-trabalhados="' + escaparAttr(pm.re || '') + '">' + Number(reg.diasTrabalhados || 0) + '</td></tr>';
        });
      });

      return '<div class="freq-table-wrap"><table class="freq-table"><thead><tr><th class="freq-pm"><strong>POLICIAL</strong><small>POSTO/GRAD • RE • NOME</small></th>' +
        Array.from({length:diasNoMes}, function(_, i) { return '<th class="freq-day">' + (i + 1) + '<small>' + escapar(rotuloDiaSemanaFrequencia(d.competencia, i + 1)) + '</small></th>'; }).join('') +
        '<th class="freq-total diarias">DIÁRIAS</th><th class="freq-total trabalhados">DIAS TRAB.</th></tr></thead><tbody>' + corpo + '</tbody></table></div>';
    }


    function rotuloDiaSemanaFrequencia(competencia, dia) {
      const partes = String(competencia || '').split('-');
      const data = new Date(Number(partes[0]), Number(partes[1]) - 1, Number(dia));
      return ['DOM','SEG','TER','QUA','QUI','SEX','SÁB'][data.getDay()] || '';
    }


    function normalizarReClienteFrequencia(re) {
      const base = String(re == null ? '' : re).trim().split('-')[0].replace(/\D/g, '');
      return base.length >= 6 ? base.substring(0, 6) : base;
    }


    function classesCelulaFrequencia(grupo, valor) {
      const v = String(valor == null ? '' : valor).trim();
      const g = String(grupo == null ? '' : grupo).trim().toUpperCase();
      const classes = [];
      if (v) classes.push('freq-preenchido');
      if ((g === 'ADM' && (v === '2' || v === '3')) || (g !== 'ADM' && v === '3')) {
        classes.push('freq-destaque');
      }
      return classes.join(' ');
    }


    function atualizarVisualCelulaFrequencia(select) {
      if (!select) return;
      const wrap = select.closest('.freq-select-wrap');
      const display = wrap ? wrap.querySelector('.freq-select-display') : null;

    function salvarCelulaFrequencia(select) {

        login: APP.credenciais.login,

        const dados = resp.dados || {};

          select.classList.remove('freq-saved');

        const anterior = select.getAttribute('data-valor-anterior');
        if (anterior !== null) select.value = anterior;
        atualizarVisualCelulaFrequencia(select);
        select.classList.remove('freq-saving');

      const dados = APP.dadosControleFrequencia || {};

      }).then(function(resp) {
        if (!resp || !resp.ok) throw new Error(resp && resp.erro ? resp.erro : 'Falha ao gerar o PDF.');
        baixarArquivoBase64Frequencia(resp.dados.base64, resp.dados.mimeType || 'application/pdf', resp.dados.nomeArquivo || 'Controle_de_Frequencia.pdf');

    function baixarArquivoBase64Frequencia(base64, mimeType, nomeArquivo) {
      const texto = String(base64 || '').replace(/\s/g, '');
      if (!texto) throw new Error('O arquivo PDF retornou vazio.');
      const binario = window.atob(texto);
      const bytes = new Uint8Array(binario.length);
      for (let indice = 0; indice < binario.length; indice++) bytes[indice] = binario.charCodeAt(indice);
      const url = URL.createObjectURL(new Blob([bytes], { type: mimeType || 'application/pdf' }));
      const link = document.createElement('a');
      link.href = url;
      link.download = nomeArquivo || 'Controle_de_Frequencia.pdf';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      setTimeout(function() { URL.revokeObjectURL(url); }, 1500);
    }

    function montarTabelaControleFolgas(d) {
      const diasNoMes = Number(d.diasNoMes || 31);
      const efetivo = d.efetivo || [];
      const lancamentos = d.lancamentos || {};
      const saldos = d.saldos || {};
      const opcoes = d.opcoes || [];
      const podeEditar = !!(d.capacidades && d.capacidades.podeEditar);
      let corpo = '';

      ['ADM', '1º PEL', '2º PEL'].forEach(function(grupo) {
        const lista = efetivo.filter(function(pm) { return pm.pelotao === grupo; });
        if (!lista.length) return;
        corpo += '<tr class="freq-group"><td colspan="' + (diasNoMes + 3) + '">' + escapar(grupo) + '</td></tr>';
        lista.forEach(function(pm) {
          const chave = normalizarReClienteFrequencia(pm.re);
          const reg = lancamentos[chave] || { dias: [] };
          const saldo = saldos[chave] || { folgas: 0, diasTrabalhados: 0 };
          corpo += '<tr data-folga-re="' + escaparAttr(pm.re || '') + '">' +
            '<td class="freq-pm"><strong>' + escapar([pm.postoGrad, pm.nomeGuerra].filter(Boolean).join(' ')) + '</strong><small>RE ' + escapar(pm.re || '') + '</small></td>' +
            Array.from({ length: diasNoMes }, function(_, indice) {
              const dia = indice + 1;
              const dataISO = d.competencia + '-' + String(dia).padStart(2, '0');
              const anteriorImplantacao = dataISO < String(d.implantacaoISO || '2026-08-12');
              const atual = String((reg.dias || [])[indice] || '');
              const classes = classesCelulaControleFolgas(atual, true);
              const bloqueado = !podeEditar || anteriorImplantacao;
              return '<td class="freq-day ' + (anteriorImplantacao ? 'folga-dia-inativo' : '') + '"><div class="freq-select-wrap ' + classes + (bloqueado ? ' freq-bloqueado' : '') + '"><span class="freq-select-display" aria-hidden="true">' + escapar(atual) + '</span><select class="freq-native-select ' + classes + '" aria-label="Dia ' + dia + ' de ' + escapar(pm.nomeGuerra || '') + '" data-grupo="' + escaparAttr(grupo) + '" data-re="' + escaparAttr(pm.re || '') + '" data-dia="' + dia + '" data-valor-anterior="' + escaparAttr(atual) + '" onchange="salvarCelulaControleFolgas(this)" ' + (bloqueado ? 'disabled' : '') + '>' +
                '<option value=""></option>' + opcoes.map(function(op) { return '<option value="' + escaparAttr(op) + '" ' + (atual === String(op) ? 'selected' : '') + '>' + escapar(op) + '</option>'; }).join('') +
                '</select></div></td>';
            }).join('') +
            '<td class="freq-total diarias" data-total-folgas="' + escaparAttr(pm.re || '') + '">' + Number(saldo.folgas || 0) + '</td>' +
            '<td class="freq-total trabalhados" data-total-ciclo-folgas="' + escaparAttr(pm.re || '') + '">' + Number(saldo.diasTrabalhados || 0) + '</td></tr>';
        });
      });

      return '<div class="freq-table-wrap"><table class="freq-table folga-table"><thead><tr><th class="freq-pm"><strong>POLICIAL</strong><small>POSTO/GRAD • RE • NOME</small></th>' +
        Array.from({ length: diasNoMes }, function(_, i) { return '<th class="freq-day">' + (i + 1) + '<small>' + escapar(rotuloDiaSemanaFrequencia(d.competencia, i + 1)) + '</small></th>'; }).join('') +
        '<th class="freq-total diarias">FOLGAS</th><th class="freq-total trabalhados">DIAS TRAB.</th></tr></thead><tbody>' + corpo + '</tbody></table></div>';
    }


    function classesCelulaControleFolgas(valor, confirmado) {
      const codigo = String(valor == null ? '' : valor).trim().toUpperCase();
      const classes = [];
      if (codigo) classes.push('freq-preenchido');
      if (confirmado && codigo === 'EO') classes.push('folga-eo-confirmado');
      if (confirmado && ['DS', 'CM', 'LTS', 'LSV', 'CEP', 'OUT'].indexOf(codigo) !== -1) {
        classes.push('folga-reset-confirmado');
      }
      return classes.join(' ');
    }


    function atualizarVisualCelulaControleFolgas(select, confirmado) {
      if (!select) return;
      const wrap = select.closest('.freq-select-wrap');

      const classesControladas = ['freq-preenchido', 'folga-eo-confirmado', 'folga-reset-confirmado'];
      const classesAtuais = classesCelulaControleFolgas(select.value, !!confirmado).split(' ').filter(Boolean);
      classesControladas.forEach(function(classe) {
        select.classList.remove(classe);
        if (wrap) wrap.classList.remove(classe);
      });
      classesAtuais.forEach(function(classe) {
        select.classList.add(classe);
        if (wrap) wrap.classList.add(classe);
      });
      if (display) display.textContent = String(select.value || '');
    }

        setTimeout(function() {

          if (wrap) wrap.classList.remove('freq-saved');
        }, 800);
      }).catch(function(err) {
        const anterior = select.getAttribute('data-valor-anterior');
        if (anterior !== null) select.value = anterior;
        atualizarVisualCelulaControleFolgas(select, true);
        select.classList.remove('freq-saving');
        if (wrap) wrap.classList.remove('freq-saving');
        mostrarToastFt('Lançamento não salvo', err.message || String(err));
      }).finally(function() {
        if (select && document.body.contains(select)) select.disabled = false;
      });
    }

    function visualizarEscalaCiaFt(idEscala, botao) {
      if (!idEscala) return;
      const textoAnterior = botao ? botao.textContent : '';
      if (botao) { botao.disabled = true; botao.textContent = 'ABRINDO...'; }
      chamarApi('baixar_escala_cia_ft', {
        login: APP.credenciais.login,
        senha: APP.credenciais.senha,
        idEscala: idEscala
      }).then(function(resp) {
        if (!resp || !resp.ok) throw new Error(resp && resp.erro ? resp.erro : 'Falha ao abrir a escala.');
        return exibirPdfEscalaCiaFt(resp.dados.base64, resp.dados.nomeArquivo, resp.dados.mimeType);
      }).catch(function(err) {
        mostrarToastFt('Escala não aberta', err.message || String(err));
      }).finally(function() {
        if (botao && document.body.contains(botao)) { botao.disabled = false; botao.textContent = textoAnterior || 'VISUALIZAR PDF'; }
      });
    }


    async function exibirPdfEscalaCiaFt(base64, nomeArquivo, mimeType) {
      fecharVisualizadorPdfEscalaCiaFt();
      const texto = String(base64 || '').replace(/\s/g, '');
      if (!texto) throw new Error('O PDF retornado está vazio.');
      const binario = window.atob(texto);
      const bytes = new Uint8Array(binario.length);
      for (let indice = 0; indice < binario.length; indice++) bytes[indice] = binario.charCodeAt(indice);
      const tokenRender = ++APP.pdfRenderToken;
      const modal = document.createElement('div');
      modal.id = 'efPdfModal';
      modal.className = 'ef-pdf-modal';
      modal.innerHTML = '<div class="ef-pdf-dialog" role="dialog" aria-modal="true" aria-label="Visualizador da Escala Cia FT"><div class="ef-pdf-head"><strong>' + escapar(nomeArquivo || 'Escala Cia FT.pdf') + '</strong><div class="ef-pdf-actions"><button type="button" onclick="fecharVisualizadorPdfEscalaCiaFt()">FECHAR</button></div></div><div id="efPdfPages" class="ef-pdf-pages"><div class="ef-pdf-loading">Preparando todas as páginas da escala...</div></div></div>';
      modal.addEventListener('click', function(ev) { if (ev.target === modal) fecharVisualizadorPdfEscalaCiaFt(); });
      document.body.appendChild(modal);

      const paginas = document.getElementById('efPdfPages');
      if (!window.pdfjsLib) {
        const url = URL.createObjectURL(new Blob([bytes], { type: mimeType || 'application/pdf' }));
        APP.urlPdfEscalaCiaFt = url;
        paginas.innerHTML = '<iframe class="ef-pdf-frame" src="' + escaparAttr(url + '#toolbar=0&navpanes=0') + '" title="PDF da Escala Cia FT"></iframe>';
        return;
      }

      try {
        const tarefa = window.pdfjsLib.getDocument({ data: bytes });
        const pdf = await tarefa.promise;
        if (tokenRender !== APP.pdfRenderToken || !document.getElementById('efPdfModal')) return;
        paginas.innerHTML = '';

        for (let numeroPagina = 1; numeroPagina <= pdf.numPages; numeroPagina++) {
          if (tokenRender !== APP.pdfRenderToken || !document.getElementById('efPdfModal')) return;
          const pagina = await pdf.getPage(numeroPagina);
          const base = pagina.getViewport({ scale: 1 });
          const larguraDisponivel = Math.max(280, Math.min(1050, paginas.clientWidth - 24));
          const escalaCss = larguraDisponivel / base.width;
          const viewport = pagina.getViewport({ scale: escalaCss });
          const densidade = Math.min(2, Math.max(1, window.devicePixelRatio || 1));
          const bloco = document.createElement('section');
          bloco.className = 'ef-pdf-page';
          bloco.innerHTML = '<div class="ef-pdf-page-label">PÁGINA ' + numeroPagina + ' DE ' + pdf.numPages + '</div>';
          const canvas = document.createElement('canvas');
          const contexto = canvas.getContext('2d', { alpha: false });
          canvas.width = Math.floor(viewport.width * densidade);
          canvas.height = Math.floor(viewport.height * densidade);
          canvas.style.width = Math.floor(viewport.width) + 'px';
          canvas.style.height = Math.floor(viewport.height) + 'px';
          bloco.appendChild(canvas);
          paginas.appendChild(bloco);
          await pagina.render({ canvasContext: contexto, viewport: viewport, transform: densidade === 1 ? null : [densidade, 0, 0, densidade, 0, 0] }).promise;
        }
      } catch (erro) {
        if (tokenRender !== APP.pdfRenderToken || !paginas) return;
        paginas.innerHTML = '<div class="ef-pdf-loading">Não foi possível renderizar todas as páginas deste PDF.<br>' + escapar(erro && erro.message ? erro.message : erro) + '</div>';
        throw erro;
      }
    }


    function fecharVisualizadorPdfEscalaCiaFt() {
      APP.pdfRenderToken = Number(APP.pdfRenderToken || 0) + 1;
      const modal = document.getElementById('efPdfModal');
      if (modal) modal.remove();
      if (APP && APP.urlPdfEscalaCiaFt) {
        try { URL.revokeObjectURL(APP.urlPdfEscalaCiaFt); } catch (ignorado) {}
        APP.urlPdfEscalaCiaFt = null;
      }
    }

    function usuarioTemPermissaoCliente(modulo, acao) {
      const chave = normalizarModuloCliente(modulo);
      const permissao = obterPermissaoCliente(chave);

      if (!permissao) return false;
      if (permissao.acessoTotal) return true;

      const campo = acao || 'visualizar';
      return !!permissao[campo];
    }


    function obterPermissaoCliente(modulo) {
      const permissoes = APP.permissoes || {};
      const alvo = normalizarModuloCliente(modulo);
      const aliases = aliasesModuloCliente(alvo);

      for (let i = 0; i < aliases.length; i++) {
        if (permissoes[aliases[i]]) return permissoes[aliases[i]];
      }

      const chaves = Object.keys(permissoes);
      for (let i = 0; i < chaves.length; i++) {
        if (aliases.indexOf(normalizarModuloCliente(chaves[i])) !== -1) {
          return permissoes[chaves[i]];
        }
      }

      return null;
    }


    function aliasesModuloCliente(modulo) {
      const alvo = normalizarModuloCliente(modulo);

      if (alvo === 'RESENHA_DE_ESCALAS') {
        return [
          'RESENHA_DE_ESCALAS',
          'RESENHAS_ESCALAS',
          'RESENHA_ESCALAS',
          'ENVIAR_RESENHAS_ESCALA',
          'ENVIAR_RESENHA_ESCALA'
        ];
      }

      if (alvo === 'ESCALAS_ADM') {
        return [
          'ESCALAS_ADM',
          'ESCALA_ADM',
          'MINHA_ESCALA_ADM',
          'ENVIAR_ESCALA_ADM'
        ];
      }

      return [alvo];
    }


    function normalizarModuloCliente(valor) {
      const m = normalizarTexto(valor)
        .replace(/\//g, ' ')
        .replace(/-/g, ' ')
        .replace(/\s+/g, '_');

      const aliases = {
        'RESENHAS_ESCALAS': 'RESENHA_DE_ESCALAS',
        'RESENHA_ESCALAS': 'RESENHA_DE_ESCALAS',
        'RESENHA_DE_ESCALAS': 'RESENHA_DE_ESCALAS',
        'RESENHA_DE_ESCALA': 'RESENHA_DE_ESCALAS',
        'RESENHA_ESCALA': 'RESENHA_DE_ESCALAS',
        'ENVIAR_RESENHAS_ESCALA': 'RESENHA_DE_ESCALAS',
        'ENVIAR_RESENHA_ESCALA': 'RESENHA_DE_ESCALAS',
        'ESCALA_ADM': 'ESCALAS_ADM',
        'MINHA_ESCALA_ADM': 'ESCALAS_ADM',
        'ENVIAR_ESCALA_ADM': 'ESCALAS_ADM',
        'ESCALAS_ADMINISTRATIVAS': 'ESCALAS_ADM',
        'ESCALAS_FOLGAS': 'ESCALAS_E_FOLGAS',
        'ESCALAS_E_FOLGAS': 'ESCALAS_E_FOLGAS',
        'CONSULTA EFETIVO': 'CONSULTA_EFETIVO',
        'CONSULTAR_EFETIVO': 'CONSULTA_EFETIVO'
      };

      return aliases[m] || m;
    }


    function ehModuloConsultaEfetivo(id) {
      return normalizarModuloCliente(id) === 'CONSULTA_EFETIVO';
    }


    function ehModuloViaturas(id) {

      document.querySelectorAll('#formResenhaEscala select').forEach(function(sel) {

    function atualizarDisponibilidadeResenha() {
      bloquearDuplicadosPorClasse('.pm-select');
      bloquearDuplicadosPorClasse('.vtr-select');
    }


    function bloquearDuplicadosPorClasse(selector) {
      const selects = Array.from(document.querySelectorAll('#formResenhaEscala ' + selector));
      const escolhidos = selects
        .map(s => s.value)
        .filter(v => v);

      selects.forEach(function(sel) {
        Array.from(sel.options).forEach(function(opt) {
          if (!opt.value) {
            opt.disabled = false;
            return;
          }

          opt.disabled = opt.value !== sel.value && escolhidos.includes(opt.value);
        });
      });
    }


    function atualizarRegrasFolgaDispensa(sel) {
      const box = sel.closest('.resenha-equipe-box');
      if (!box) return;

      const tipo = normalizarTexto(sel.value);
      const dataBox = box.querySelector('.campo-data-referencia');
      const bopmBox = box.querySelector('.campo-bopm');
      const data = box.querySelector('input[name$="_data"]');
      const bopm = box.querySelector('input[name$="_bopm"]');

      const exigeData = tipo.includes('ORGANICA') || tipo.includes('COMPENSATORIA') || tipo.includes('FLAGRANTE');
      const exigeBopm = tipo.includes('FLAGRANTE');

      if (dataBox) {
        dataBox.classList.toggle('campo-oculto', !exigeData);
        dataBox.classList.toggle('full', exigeData && !exigeBopm);
      }

      if (bopmBox) {
        bopmBox.classList.toggle('campo-oculto', !exigeBopm);
        bopmBox.classList.toggle('full', exigeBopm && !exigeData);
      }

      if (data) {
        data.required = exigeData;
        if (!exigeData) data.value = '';
      }

      if (bopm) {
        bopm.required = exigeBopm;
        bopm.placeholder = exigeBopm ? 'BOPM obrigatório' : 'BOPM';
        if (!exigeBopm) bopm.value = '';
      }
    }

    function enviarResenhaEscalaVisual() {
      const form = document.getElementById('formResenhaEscala');

      if (
        !usuarioTemPermissaoCliente('RESENHA_DE_ESCALAS', 'inserir') &&
        !usuarioTemPermissaoCliente('RESENHA_DE_ESCALAS', 'editar')
      ) {
        mostrarToastFt('Resenha não enviada', 'Seu perfil não possui permissão para inserir ou editar resenhas.');
        return;
      }

      const validacao = validarResenhaEscala();
      if (!validacao.ok) {
        mostrarValidacaoResenha(validacao.erros);
        mostrarToastFt('Resenha não enviada', 'Corrija os campos obrigatórios antes de enviar.');
        return;
      }

      limparValidacaoResenha();

      if (!APP.credenciais || !APP.credenciais.login || !APP.credenciais.senha) {
        mostrarToastFt('Sessão inválida', 'Faça login novamente.');
        return;
      }

      const payload = coletarPayloadResenhaEscala();
      const btn = document.querySelector('.resenha-submit');
      if (btn) {
        btn.disabled = true;
        btn.textContent = 'ENVIANDO...';
      }

      chamarApi('enviar_resenha_escala', {
          login: APP.credenciais.login,
          senha: APP.credenciais.senha,
          payload: JSON.stringify(payload)
        })
        .then(function(resp) {
          if (!resp || !resp.ok) throw new Error(resp && resp.erro ? resp.erro : 'Falha ao enviar resenha.');
          mostrarToastFt('Resenha enviada', resp.dados && resp.dados.mensagem ? resp.dados.mensagem : 'Resenha gravada com sucesso.');
          if (form) form.reset();
          renderizarFormularioResenha();
          window.scrollTo(0, 0);
        })
        .catch(function(err) {
          mostrarToastFt('Resenha não enviada', err.message || String(err));
        })
        .finally(function() {
          if (btn) {
            btn.disabled = false;
            btn.textContent = 'ENVIAR RESENHA DE ESCALA';
          }
        });
    }



    function coletarPayloadResenhaEscala() {
      const itens = [];
      const complementos = [];
      const dataEscala = document.getElementById('resenhaDataEscala') ? document.getElementById('resenhaDataEscala').value : '';
      const pelotao = document.getElementById('resenhaPelotao') ? document.getElementById('resenhaPelotao').value : '';
      const horarioEscala = document.getElementById('resenhaHorarioEscala') ? document.getElementById('resenhaHorarioEscala').value : '';
      const observacoes = document.getElementById('resenhaObservacoes') ? document.getElementById('resenhaObservacoes').value : '';

      document.querySelectorAll('#formResenhaEscala [data-tipo]').forEach(function(box) {
        const tipo = box.getAttribute('data-tipo') || '';
        const numero = box.getAttribute('data-numero') || '';
        box.querySelectorAll('input, select, textarea').forEach(function(el) {
          const valor = String(el.value || '').trim();
          if (!valor) return;
          const label = el.closest('.resenha-mini-field, .resenha-form-field')?.querySelector('label')?.textContent || el.name || 'Campo';
          const textoVisivel = el.tagName === 'SELECT' && el.selectedOptions && el.selectedOptions[0]
            ? String(el.selectedOptions[0].textContent || '').trim()
            : valor;
          itens.push({
            tipo: tipo,
            grupo: numero,
            campo: label,
            valor: textoVisivel || valor,
            valorTecnico: valor
          });
        });
      });

      if (observacoes) complementos.push({ tipo: 'OBSERVACOES', texto: observacoes });

      return {
        dataEscala: dataEscala,
        pelotao: pelotao,
        horarioEscala: horarioEscala,
        observacoes: observacoes,
        itens: itens,
        complementos: complementos
      };
    }

    function validarResenhaEscala() {
      const erros = [];

      document.querySelectorAll('#folgasDispensasWrap [data-tipo="FOLGA_DISPENSA"]').forEach(function(box, idx) {
        const numero = idx + 1;
        const tipoSel = box.querySelector('select[name$="_tipo"]');
        const pmSel = box.querySelector('select[name$="_pm"]');
        const data = box.querySelector('input[name$="_data"]');
        const bopm = box.querySelector('input[name$="_bopm"]');

        const tipo = normalizarTexto(tipoSel ? tipoSel.value : '');
        const temPm = pmSel && pmSel.value;
        const temTipo = tipoSel && tipoSel.value;

        if (!temPm && !temTipo) return;

        if (temPm && !temTipo) {
          erros.push('Folga/Dispensa ' + numero + ': selecione o tipo.');
          return;
        }

        if (!temPm && temTipo) {
          erros.push('Folga/Dispensa ' + numero + ': selecione o policial.');
          return;
        }

        if ((tipo.includes('ORGANICA') || tipo.includes('COMPENSATORIA')) && (!data || !data.value)) {
          erros.push('Folga/Dispensa ' + numero + ': Folga Orgânica ou Compensatória exige Data de referência.');
        }

        if (tipo.includes('FLAGRANTE')) {
          if (!data || !data.value) {
            erros.push('Folga/Dispensa ' + numero + ': Folga Flagrante exige Data de referência.');
          }
          if (!bopm || !String(bopm.value || '').trim()) {
            erros.push('Folga/Dispensa ' + numero + ': Folga Flagrante exige BOPM.');
          }
        }
      });

      return {
        ok: erros.length === 0,
        erros: erros
      };
    }

    function obterRegiaoToastFt() {
      let regiao = document.getElementById('toastFtRegion');
      if (regiao) return regiao;

      regiao = document.createElement('div');
      regiao.id = 'toastFtRegion';
      regiao.className = 'toast-ft-region';

      document.body.appendChild(regiao);
      return regiao;
    }


    function inferirTipoToastFt(titulo, tipoInformado) {
      const permitido = ['sucesso', 'erro', 'atencao', 'info', 'confirmacao'];
      const tipo = String(tipoInformado || '').toLowerCase();
      if (permitido.indexOf(tipo) !== -1) return tipo;

      const texto = String(titulo || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toUpperCase();
      if (/(ERRO|FALHA|NAO SALV|NAO REGISTR|NAO ENCONTR|NEGAD|INVALID|OBRIGAT|BLOQUEAD)/.test(texto)) return 'erro';
      if (/(ATENCAO|ALERTA|JA |PENDENTE|LIMITE|MINIMO|NENHUM)/.test(texto)) return 'atencao';
      if (/(SUCESSO|ENVIAD|ATUALIZAD|REGISTRAD|CONCLUID|ALTERAD|ARQUIVAD|INATIVAD|INICIAD|ENCERRAD|ADICIONAD|SALV)/.test(texto)) return 'sucesso';
      return 'info';
    }


    function visualTipoToastFt(tipo) {
      const visuais = {
        sucesso: { icone: '✓', titulo: 'SUCESSO' },
        erro: { icone: '!', titulo: 'NÃO FOI POSSÍVEL' },
        atencao: { icone: '!', titulo: 'ATENÇÃO' },
        info: { icone: 'i', titulo: 'INFORMAÇÃO' },
        confirmacao: { icone: '?', titulo: 'CONFIRMAÇÃO' }
      };
      return visuais[tipo] || visuais.info;
    }


    function criarToastFt(opcoes) {
      const config = opcoes || {};
      const tipo = inferirTipoToastFt(config.titulo, config.tipo);
      const visual = visualTipoToastFt(tipo);
      const duracao = Math.max(2500, Number(config.duracao || 4800));
      const persistente = !!config.persistente;
      const regiao = obterRegiaoToastFt();
      const toastId = 'toastFt-' + Date.now() + '-' + Math.random().toString(36).slice(2, 8);

      while (regiao.children.length >= 5) {
        const descartavel = regiao.querySelector('.toast-ft:not(.persistente)') || regiao.firstElementChild;
        if (!descartavel) break;
        const fecharAntigo = descartavel.querySelector('.toast-ft-fechar');
        if (fecharAntigo) fecharAntigo.click();
        if (descartavel.parentNode) descartavel.parentNode.removeChild(descartavel);
      }

      const toast = document.createElement('section');
      toast.id = toastId;
      toast.className = 'toast-ft ' + tipo + (persistente ? ' persistente' : '');
      toast.setAttribute('role', tipo === 'erro' || tipo === 'confirmacao' ? 'alert' : 'status');
      toast.setAttribute('aria-labelledby', toastId + '-titulo');
      toast.setAttribute('aria-describedby', toastId + '-texto');
      toast.innerHTML =
        '<span class="toast-ft-icone" aria-hidden="true">' + escapar(visual.icone) + '</span>' +
        '<div class="toast-ft-conteudo">' +
          '<strong class="toast-ft-titulo" id="' + toastId + '-titulo">' + escapar(config.titulo || visual.titulo) + '</strong>' +
          '<span class="toast-ft-texto" id="' + toastId + '-texto">' + escapar(config.texto || '') + '</span>' +
        '</div>' +
        '<button class="toast-ft-fechar" type="button" aria-label="Fechar aviso">×</button>' +
        (config.acoes && config.acoes.length ?
          '<div class="toast-ft-acoes">' + config.acoes.map(function(acao, indice) {
            return '<button class="toast-ft-acao ' + (acao.primaria ? 'primaria' : 'secundaria') + '" type="button" data-toast-acao="' + indice + '">' + escapar(acao.rotulo || 'OK') + '</button>';
          }).join('') + '</div>' : '') +
        '<span class="toast-ft-progresso" aria-hidden="true" style="animation-duration:' + duracao + 'ms"></span>';

      regiao.appendChild(toast);
      let encerrado = false;
      let timer = null;

      function fechar(resultado) {
        if (encerrado) return;
        encerrado = true;
        if (timer) clearTimeout(timer);
        toast.classList.add('saindo');
        toast.classList.remove('visivel');
        if (typeof config.aoResponder === 'function') config.aoResponder(resultado);
        setTimeout(function() {
          if (toast.parentNode) toast.parentNode.removeChild(toast);
        }, 230);
      }

      toast.querySelector('.toast-ft-fechar').addEventListener('click', function() { fechar(false); });
      Array.prototype.forEach.call(toast.querySelectorAll('[data-toast-acao]'), function(botao) {
        botao.addEventListener('click', function() {
          const indice = Number(botao.getAttribute('data-toast-acao'));
          const acao = (config.acoes || [])[indice] || {};
          fechar(!!acao.resultado);
        });
      });
      toast.addEventListener('keydown', function(evento) {
        if (evento.key === 'Escape') fechar(false);
      });

      setTimeout(function() { toast.classList.add('visivel'); }, 10);
      if (!persistente) timer = setTimeout(function() { fechar(null); }, duracao);

      if (tipo === 'confirmacao') {
        toast.tabIndex = -1;
        setTimeout(function() {
          const principal = toast.querySelector('.toast-ft-acao.primaria');
          if (principal) principal.focus();
          else toast.focus();
        }, 30);
      }

      return { elemento: toast, fechar: fechar };
    }

    function encontrarMinhaEscalaAdm(lista) {
      const login = normalizarLoginCliente(APP.usuario && (APP.usuario.login || APP.usuario.re));
      if (!login || !Array.isArray(lista)) return null;

      return lista.find(function(item) {
        return normalizarLoginCliente(item && item.re) === login;
      }) || null;
    }


    function escalaAdmPodeSerEditadaPeloUsuario(item) {
      if (!item) return true;

      const podeEditarModulo = usuarioTemPermissaoCliente('ESCALAS_ADM', 'editar') || usuarioTemPermissaoCliente('ESCALAS_ADM', 'aprovar');
      if (podeEditarModulo) return true;

      const decisao = normalizarTexto(item.decisao || 'PENDENTE');
      if (!decisao || decisao === 'PENDENTE' || decisao.includes('CORRECAO')) return true;

      return false;
    }

        : '';

      return `

    function preencherFormularioEscalasAdm(item, dias, podeEditar) {
      if (!item || !Array.isArray(dias)) return;

      dias.forEach(function(dia) {
        const valor = String(item[dia.chave] || '').trim();
        const partes = interpretarValorEscalaAdm(valor);
        const tipoEl = document.getElementById('adm_' + dia.chave + '_tipo');
        const horarioEl = document.getElementById('adm_' + dia.chave + '_horario');
        const detalheEl = document.getElementById('adm_' + dia.chave + '_detalhe');

        if (tipoEl) tipoEl.value = partes.tipo;
        atualizarDiaEscalaAdm(dia.chave);
        if (horarioEl) horarioEl.value = partes.horario || '';
        if (detalheEl) detalheEl.value = partes.detalhe || '';
      });

      const obsEl = document.getElementById('escalaAdmObservacoes');
      if (obsEl) obsEl.value = item.observacoes || '';
    }


    function interpretarValorEscalaAdm(valor) {
      const texto = String(valor || '').trim();
      const norm = normalizarTexto(texto);

      if (!texto) return { tipo: '', horario: '', detalhe: '' };
      if (norm.indexOf('OUTROS -') === 0) {
        return { tipo: 'OUTROS', horario: '', detalhe: texto.replace(/^OUTROS\s*-\s*/i, '') };
      }
      if (norm.indexOf('DAS ') === 0 || /\d{1,2}[:Hh]\d{0,2}/.test(texto)) {
        return { tipo: 'EXPEDIENTE', horario: texto, detalhe: '' };
      }

      return { tipo: texto, horario: '', detalhe: '' };
    }


    function normalizarLoginCliente(valor) {
      const texto = String(valor || '').trim();
      const antesHifen = texto.split('-')[0];
      const nums = antesHifen.replace(/\D/g, '');
      return nums.length >= 6 ? nums.substring(0, 6) : nums;
    }


    function atualizarDiaEscalaAdm(chave) {
      const tipoEl = document.getElementById('adm_' + chave + '_tipo');
      const horarioEl = document.getElementById('adm_' + chave + '_horario');
      const detalheEl = document.getElementById('adm_' + chave + '_detalhe');

      if (!tipoEl || !horarioEl || !detalheEl) return;

      const tipo = normalizarTexto(tipoEl.value);
      const exigeHorario = tipo === 'EXPEDIENTE';
      const exigeDetalhe = tipo === 'OUTROS';

      horarioEl.classList.toggle('campo-oculto', !exigeHorario);
      detalheEl.classList.toggle('campo-oculto', !exigeDetalhe);

      if (!exigeHorario) horarioEl.value = '';
      if (!exigeDetalhe) detalheEl.value = '';
    }


    function enviarEscalaAdm() {
      if (!usuarioTemPermissaoCliente('ESCALAS_ADM', 'inserir')) {
        mostrarToastFt('Escala não enviada', 'Seu perfil não possui permissão para enviar Escalas ADM.');
        return;
      }

      if (APP.minhaEscalaAdmAtual && !escalaAdmPodeSerEditadaPeloUsuario(APP.minhaEscalaAdmAtual)) {
        mostrarToastFt('Edição bloqueada', 'Esta escala não está liberada para alteração pelo seu perfil neste momento.');
        return;
      }

      const dados = coletarEscalaAdmFormulario();

      if (!dados.ok) {
        mostrarValidacaoAdm(dados.erros);
        mostrarToastFt('Escala não enviada', 'Corrija os campos obrigatórios antes de enviar.');
        return;
      }

      limparValidacaoAdm();

      chamarApi('enviar_escala_adm', Object.assign({
          login: APP.credenciais.login,
          senha: APP.credenciais.senha
        }, dados.payload))
        .then(function(resp) {
          if (!resp || !resp.ok) {
            throw new Error(resp && resp.erro ? resp.erro : 'Falha ao enviar Escala ADM.');
          }

          const jaTinhaEscala = !!APP.minhaEscalaAdmAtual;
          mostrarToastFt(jaTinhaEscala ? 'Escala ADM atualizada' : 'Escala ADM enviada', jaTinhaEscala ? 'Sua escala administrativa foi atualizada e voltou para decisão PENDENTE.' : 'Sua escala administrativa foi registrada com decisão PENDENTE.');

          APP.dadosEscalasAdm = null;
      APP.dadosConsultaEfetivo = null;
      APP.dadosViaturas = null;
      APP.dadosRotinasAdministrativas = null;
          return carregarDadosEscalasAdm();
        })
        .then(renderizarEscalasAdm)
        .catch(function(err) {
          mostrarToastFt('Erro ao enviar', err.message || String(err));
        });
    }


    function coletarEscalaAdmFormulario() {
      const dados = APP.dadosEscalasAdm || {};
      const semana = dados.semanaAdm || montarSemanaAdmCliente();
      const dias = semana.dias || [];
      const erros = [];
      const payload = {};

      dias.forEach(function(dia) {
        const tipoEl = document.getElementById('adm_' + dia.chave + '_tipo');
        const horarioEl = document.getElementById('adm_' + dia.chave + '_horario');
        const detalheEl = document.getElementById('adm_' + dia.chave + '_detalhe');

        const tipo = tipoEl ? String(tipoEl.value || '').trim() : '';
        const tipoNorm = normalizarTexto(tipo);
        const horario = horarioEl ? String(horarioEl.value || '').trim() : '';
        const detalhe = detalheEl ? String(detalheEl.value || '').trim() : '';

        if (!tipo) {
          erros.push(dia.rotulo + ': selecione o tipo.');
          return;
        }

        if (tipoNorm === 'EXPEDIENTE') {
          if (!horario) {
            erros.push(dia.rotulo + ': informe o horário do expediente.');
            return;
          }

          payload[dia.chave] = horario;
          return;
        }

        if (tipoNorm === 'OUTROS') {
          if (!detalhe) {
            erros.push(dia.rotulo + ': descreva o campo OUTROS.');
            return;
          }

          payload[dia.chave] = 'OUTROS - ' + detalhe;
          return;
        }

        payload[dia.chave] = tipo;
      });

      const obsEl = document.getElementById('escalaAdmObservacoes');
      payload.observacoes = String(obsEl ? obsEl.value : '').trim();

      return {
        ok: erros.length === 0,
        erros: erros,
        payload: payload
      };
    }


    function mostrarValidacaoAdm(erros) {
      const box = document.getElementById('admValidacao');
      if (!box) return;

      box.innerHTML = '<strong>Escala não enviada</strong>' + erros.map(function(e) {
        return '<div>• ' + escapar(e) + '</div>';
      }).join('');

      box.classList.add('visivel');
      box.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }


    function limparValidacaoAdm() {
      const box = document.getElementById('admValidacao');
      if (!box) return;

      box.innerHTML = '';
      box.classList.remove('visivel');
    }

      const hoje = new Date();
      const fim = dataISOCliente_(hoje);

      const inicio = dataISOCliente_(inicioData);

      return `

                <input id="admHistoricoInicio" type="date" value="${escaparAttr(inicio)}">

        </div>
